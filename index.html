<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7FBFF">
<title>26Q19 · 班级活动记录</title>
<style>
  *,*::before,*::after{box-sizing:border-box;}
  :root{
    --blue-900:#123A63;
    --blue-700:#1E5FA8;
    --blue-500:#3B82D6;
    --blue-300:#8FBEF0;
    --blue-100:#E4F0FF;
    --text:#1F3550;
    --muted:#6B87A6;
    --warm:#FFB86B;
  }
  html{
    background:#F7FBFF;
    scroll-behavior:smooth;
    -webkit-text-size-adjust:100%;
  }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    color:var(--text);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(900px 520px at 8% -12%, #DCEBFF 0%, rgba(220,235,255,0) 62%),
      radial-gradient(720px 480px at 102% -4%, #E9F4FF 0%, rgba(233,244,255,0) 58%),
      radial-gradient(680px 420px at 50% 112%, #FFF2E2 0%, rgba(255,242,226,0) 62%);
  }

  /* ---------- 顶部导航 ---------- */
  .nav{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.78);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid rgba(59,130,214,.10);
  }
  .nav-inner{
    max-width:1080px;margin:0 auto;padding:11px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
  }
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0;}
  .brand-badge{
    flex:none;padding:6px 15px;border-radius:999px;
    background:linear-gradient(135deg,#4A90E2,#2C6BB5);
    color:#fff;font-weight:800;font-size:15px;letter-spacing:.4px;
    box-shadow:0 6px 16px rgba(59,130,214,.30);
  }
  .brand-text{
    font-size:13.5px;color:var(--muted);font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .nav-links{display:flex;gap:4px;flex:none;}
  .nav-links a{
    text-decoration:none;color:var(--blue-700);font-size:14px;font-weight:600;
    padding:7px 14px;border-radius:999px;transition:background .2s;
  }
  .nav-links a:hover{background:var(--blue-100);}

  /* ---------- 首屏 ---------- */
  .hero{
    max-width:1080px;margin:0 auto;
    padding:clamp(48px,10vw,78px) 20px clamp(36px,7vw,56px);
    text-align:center;
  }
  .hero-eyebrow{
    display:inline-block;margin:0 0 18px;padding:6px 16px;border-radius:999px;
    background:#fff;border:1px solid rgba(59,130,214,.18);
    color:var(--blue-700);font-size:13px;font-weight:600;
    box-shadow:0 4px 14px rgba(59,130,214,.10);
  }
  .hero h1{
    margin:0 0 16px;
    font-size:clamp(32px,7.5vw,52px);
    line-height:1.25;letter-spacing:-.5px;font-weight:800;
    color:var(--blue-900);
  }
  .grad{
    background:linear-gradient(120deg,#3B82D6,#63A4E8 58%,var(--warm));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero-sub{
    margin:0 auto 32px;max-width:520px;
    color:var(--muted);font-size:clamp(15px,2.7vw,17px);
  }
  .hero-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}

  /* ---------- 按钮 ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 26px;border-radius:999px;border:1px solid transparent;
    font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;
    text-decoration:none;white-space:nowrap;
    transition:transform .2s,box-shadow .2s,background .2s;
  }
  .btn-primary{
    background:linear-gradient(135deg,#4A90E2,#2E6FBE);color:#fff;
    box-shadow:0 10px 24px rgba(59,130,214,.30);
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(59,130,214,.38);}
  .btn-ghost{
    background:#fff;color:var(--blue-700);
    border-color:rgba(59,130,214,.22);
    box-shadow:0 6px 18px rgba(59,130,214,.10);
  }
  .btn-ghost:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(0) scale(.98);}

  /* ---------- 区块 ---------- */
  .section{max-width:1080px;margin:0 auto;padding:22px 20px 44px;}
  .section-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:20px;
  }
  .section-head h2{
    margin:0;font-size:22px;font-weight:800;letter-spacing:-.2px;color:var(--blue-900);
  }
  .count{
    flex:none;font-size:13px;color:var(--muted);
    background:#fff;border:1px solid rgba(59,130,214,.16);
    padding:3px 12px;border-radius:999px;
  }

  /* ---------- 空状态 ---------- */
  .empty{
    background:#fff;border:1.5px dashed rgba(59,130,214,.28);
    border-radius:24px;padding:clamp(40px,9vw,58px) 24px;
    text-align:center;box-shadow:0 12px 32px rgba(59,130,214,.07);
  }
  .empty-icon{
    width:74px;height:74px;margin:0 auto 18px;border-radius:22px;
    background:linear-gradient(135deg,#EAF3FF,#F8FCFF);
    display:grid;place-items:center;
  }
  .empty h3{margin:0 0 8px;font-size:18px;color:var(--blue-900);font-weight:700;}
  .empty p{margin:0 0 24px;color:var(--muted);font-size:14.5px;}

  /* ---------- 记录卡片 ---------- */
  .records{
    display:grid;gap:16px;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  }
  .record{
    position:relative;
    background:#fff;border-radius:20px;padding:22px;
    border:1px solid rgba(59,130,214,.12);
    box-shadow:0 10px 26px rgba(59,130,214,.08);
    transition:transform .22s,box-shadow .22s;
  }
  .record:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(59,130,214,.14);}
  .record-date{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;font-weight:700;color:var(--blue-700);
    background:var(--blue-100);padding:4px 12px;border-radius:999px;
    margin-bottom:12px;max-width:calc(100% - 34px);
  }
  .record h3{margin:0 0 8px;font-size:17px;color:var(--blue-900);font-weight:700;line-height:1.45;}
  .record p{
    margin:0;color:#55708C;font-size:14.5px;
    white-space:pre-wrap;word-break:break-word;
  }
  .record-del{
    position:absolute;top:13px;right:13px;
    width:28px;height:28px;border-radius:50%;border:none;
    background:transparent;color:#A9BFD6;font-size:13px;line-height:1;
    cursor:pointer;display:grid;place-items:center;
    transition:background .2s,color .2s;
  }
  .record-del:hover{background:#FFEDE8;color:#E8604C;}

  /* ---------- 关于 ---------- */
  .about-card{
    background:linear-gradient(160deg,#FFFFFF 0%,#F2F8FF 100%);
    border:1px solid rgba(59,130,214,.14);
    border-radius:26px;padding:clamp(30px,6vw,44px) clamp(22px,5vw,36px);
    text-align:center;box-shadow:0 14px 36px rgba(59,130,214,.09);
  }
  .about-icon{
    width:66px;height:66px;margin:0 auto 18px;border-radius:20px;
    background:linear-gradient(135deg,#E4F0FF,#FFF3E3);
    display:grid;place-items:center;font-size:30px;
  }
  .about-card h2{margin:0 0 14px;font-size:21px;color:var(--blue-900);font-weight:800;}
  .about-card p{margin:0 0 6px;color:#4E6A88;font-size:15px;}
  .about-note{margin-top:20px !important;color:var(--blue-700) !important;font-weight:600;font-size:14px !important;}

  /* ---------- 页脚 ---------- */
  .footer{
    text-align:center;padding:38px 20px 56px;
    color:var(--muted);font-size:13px;
  }
  .footer p{margin:0 0 4px;}
  .footer-small{opacity:.72;font-size:12.5px;}

  /* ---------- 弹窗 ---------- */
  .modal{
    position:fixed;inset:0;z-index:100;
    background:rgba(18,58,99,.34);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    display:grid;place-items:center;padding:20px;
    opacity:0;visibility:hidden;
    transition:opacity .25s,visibility .25s;
  }
  .modal.open{opacity:1;visibility:visible;}
  .modal-card{
    width:100%;max-width:440px;
    background:#fff;border-radius:24px;padding:26px 24px;
    box-shadow:0 24px 60px rgba(18,58,99,.28);
    transform:translateY(16px) scale(.97);
    transition:transform .3s cubic-bezier(.2,.9,.3,1.2);
    max-height:calc(100vh - 40px);overflow-y:auto;
  }
  .modal.open .modal-card{transform:none;}
  .modal-card h2{margin:0 0 20px;font-size:19px;color:var(--blue-900);font-weight:800;}
  .field{margin-bottom:16px;}
  .field label{
    display:block;font-size:13px;font-weight:600;
    color:var(--blue-700);margin-bottom:6px;
  }
  .field input,.field textarea{
    width:100%;font-family:inherit;font-size:15px;color:var(--text);
    padding:12px 14px;border-radius:14px;
    border:1.5px solid #DCE9F8;background:#F9FCFF;
    outline:none;transition:border-color .2s,box-shadow .2s,background .2s;
  }
  .field input:focus,.field textarea:focus{
    border-color:#6FA8E6;background:#fff;
    box-shadow:0 0 0 4px rgba(74,144,226,.14);
  }
  .field textarea{resize:vertical;min-height:92px;line-height:1.6;}
  .modal-actions{display:flex;gap:10px;margin-top:22px;}
  .modal-actions .btn{flex:1;padding:13px 16px;}

  @media (max-width:640px){
    .nav-links{display:none;}
    .brand-text{font-size:12.5px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="#top">
      <span class="brand-badge">26Q19</span>
      <span class="brand-text">班级活动记录</span>
    </a>
    <nav class="nav-links">
      <a href="#records">活动记录</a>
      <a href="#about">关于我们</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero" id="top">
    <p class="hero-eyebrow">✨ 欢迎回家</p>
    <h1>这里是 <span class="grad">26Q19</span></h1>
    <p class="hero-sub">记录我们一起走过的日子<br>每一次欢笑，每一段时光，都值得被留下。</p>
    <div class="hero-actions">
      <button class="btn btn-primary" id="openAdd" type="button">＋ 写下第一条记录</button>
      <a class="btn btn-ghost" href="#about">了解我们</a>
    </div>
  </section>

  <section class="section" id="records">
    <div class="section-head">
      <h2>活动记录</h2>
      <span class="count" id="count">0 条</span>
    </div>

    <div class="records" id="recordsList"></div>

    <div class="empty" id="emptyState">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none"
             stroke="#4A90E2" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4.5" width="18" height="16" rx="3"/>
          <path d="M3 9.5h18"/>
          <path d="M8 3v3M16 3v3"/>
          <circle cx="9" cy="14" r="1.4"/>
          <path d="M12.5 17.2l2.6-3 2.4 2.6"/>
        </svg>
      </div>
      <h3>还没有活动记录</h3>
      <p>这里还是一片空白，第一段回忆等你来写 ✨</p>
      <button class="btn btn-primary" id="openAdd2" type="button">＋ 写下第一条记录</button>
    </div>
  </section>

  <section class="section" id="about">
    <div class="about-card">
      <div class="about-icon">🏫</div>
      <h2>关于 26Q19</h2>
      <p>这是我们班的小小角落。</p>
      <p>现在的它还是一张白纸，等着我们一起把它写满——</p>
      <p>春游的照片、运动会的呐喊、晚自习的灯光，还有那些说不完的笑话。</p>
      <p class="about-note">第一段回忆，由你来写下 ✨</p>
    </div>
  </section>
</main>

<footer class="footer">
  <p>26Q19 · 我们的班级活动记录</p>
  <p class="footer-small">愿每一次相聚，都被温柔记住。</p>
</footer>

<!-- 添加记录弹窗 -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card">
    <h2 id="modalTitle">添加一条活动记录</h2>
    <form id="recordForm" novalidate>
      <div class="field">
        <label for="fTitle">活动名称</label>
        <input id="fTitle" type="text" placeholder="例如：秋季运动会" maxlength="40" required>
      </div>
      <div class="field">
        <label for="fDate">日期</label>
        <input id="fDate" type="date">
      </div>
      <div class="field">
        <label for="fDesc">简单描述（可不填）</label>
        <textarea id="fDesc" placeholder="那天发生了什么有趣的事？" maxlength="300"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" id="cancelBtn">取消</button>
        <button class="btn btn-primary" type="submit">保存记录</button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  var KEY = '26q19_records_v1';
  var records = [];
  var storageOK = true;

  var listEl   = document.getElementById('recordsList');
  var emptyEl  = document.getElementById('emptyState');
  var countEl  = document.getElementById('count');
  var modal    = document.getElementById('modal');
  var form     = document.getElementById('recordForm');
  var dateIn   = document.getElementById('fDate');
  var titleIn  = document.getElementById('fTitle');
  var descIn   = document.getElementById('fDesc');
  var openBtn1 = document.getElementById('openAdd');

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      var data = raw ? JSON.parse(raw) : [];
      records = Array.isArray(data) ? data : [];
    } catch (e) {
      storageOK = false;
      records = [];
    }
  }

  function save() {
    if (!storageOK) return;
    try {
      localStorage.setItem(KEY, JSON.stringify(records));
    } catch (e) {
      storageOK = false;
    }
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function todayStr() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function fmtDate(v) {
    if (!v) return '';
    var p = String(v).split('-');
    if (p.length !== 3) return v;
    return p[0] + '年' + parseInt(p[1], 10) + '月' + parseInt(p[2], 10) + '日';
  }

  function render() {
    countEl.textContent = records.length + ' 条';
    openBtn1.textContent = records.length ? '＋ 添加活动记录' : '＋ 写下第一条记录';

    if (!records.length) {
      listEl.innerHTML = '';
      listEl.style.display = 'none';
      emptyEl.style.display = 'block';
      return;
    }

    listEl.style.display = 'grid';
    emptyEl.style.display = 'none';

    var html = '';
    for (var i = 0; i < records.length; i++) {
      var r = records[i] || {};
      html += '<article class="record">';
      html += '<button class="record-del" type="button" data-i="' + i + '" aria-label="删除">✕</button>';
      if (r.date) {
        html += '<span class="record-date">📅 ' + esc(fmtDate(r.date)) + '</span>';
      }
      html += '<h3>' + esc(r.title) + '</h3>';
      if (r.desc) {
        html += '<p>' + esc(r.desc) + '</p>';
      }
      html += '</article>';
    }
    listEl.innerHTML = html;
  }

  function openModal() {
    dateIn.value = todayStr();
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
    setTimeout(function () { titleIn.focus(); }, 220);
  }

  function closeModal() {
    modal.classList.remove('open');
    document.body.style.overflow = '';
    form.reset();
  }

  /* 事件绑定 */
  openBtn1.addEventListener('click', openModal);
  document.getElementById('openAdd2').addEventListener('click', openModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);

  modal.addEventListener('click', function (e) {
    if (e.target === modal) closeModal();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var title = titleIn.value.trim();
    if (!title) { titleIn.focus(); return; }

    records.unshift({
      title: title,
      date: dateIn.value,
      desc: descIn.value.trim(),
      ts: Date.now()
    });

    save();
    render();
    closeModal();
  });

  listEl.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.record-del') : null;
    if (!btn) return;
    var i = parseInt(btn.getAttribute('data-i'), 10);
    if (isNaN(i)) return;
    if (!window.confirm('确定要删除这条记录吗？')) return;
    records.splice(i, 1);
    save();
    render();
  });

  load();
  render();
})();
</script>
</body>
</html>
